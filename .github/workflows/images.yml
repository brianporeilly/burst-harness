name: images

# A merge to main builds sha-... and main; a PR builds without pushing; a
# release (release.yml) calls this for its version's tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The release's version (X.Y.Z), built from its tag vX.Y.Z.
        type: string
        required: true

permissions:
  contents: read
  packages: write

# The tests are ci.yml's.
jobs:
  # Each image for amd64 and arm64 (a Mac), each on a runner of its own
  # architecture: no QEMU, which is slow and crashes Bun-built binaries such as
  # claude and opencode (the sandbox runs both during its build). Pushed by
  # digest only; `merge` puts the two under the tags.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [burst-harness, burst-harness-sandbox, burst-harness-gateway]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: burst-harness
            context: .
            file: Dockerfile
          - image: burst-harness-sandbox
            context: images/sandbox
            file: images/sandbox/Containerfile
          - image: burst-harness-gateway
            context: gateway
            file: gateway/Containerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Labels only (the source repo, the revision); the tags go on in `merge`.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      # The commit checked out: a release's tag, not the merge that made it.
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REVISION=${{ steps.rev.outputs.sha }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          # The image last, so one image's pattern cannot take another's (burst-harness-*).
          name: digests-${{ matrix.arch }}-${{ matrix.image }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # One tag (sha-... and the branch, or a release's version) for both
  # architectures: a pull takes the one for its machine.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [burst-harness, burst-harness-sandbox, burst-harness-gateway]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.image }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,enable=${{ !inputs.version }}
            type=ref,event=branch,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
