name: release

# On each merge to main: python-semantic-release works out the next version from
# the commits since the last tag (pyproject.toml's [tool.semantic_release]). When
# there is one, it commits it to pyproject.toml, uv.lock and CHANGELOG.md, tags
# vX.Y.Z, makes the GitHub release, and the images are built for that tag.
#
# It pushes with a GitHub App's token when the repo has one (the RELEASE_APP_ID
# variable and RELEASE_APP_KEY secret), so a protected main can let the app
# alone past its rules; with the workflow's own token otherwise.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, in the order of the merges.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0  # every commit and tag since the last release
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
      # The commit that started this, not a later one merged meanwhile: that
      # one gets its own run.
      - run: git reset --hard "$GITHUB_SHA"
      - id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          github_token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}

  # A tag pushed with the workflow's own token starts no workflow, so the
  # release builds its images itself.
  images:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/images.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: write
