name: pr-title

# A squash merge makes the PR's title the commit on main, and the release reads
# the version from it (pyproject.toml's [tool.semantic_release]): it has to be a
# Conventional Commit, `type(scope): summary`.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
