[project]
name = "burst-harness"
version = "0.5.0"
description = "A contained Strands task runner, and the orchestrator that runs its sessions, jobs and tasks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic==0.125.0",
    "strands-agents==1.57.0",
    # The orchestrator's web app.
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    # Its stored credentials (orchestrator/settings.py).
    "cryptography==50.0.2",
    # Its Slack bot (orchestrator/slack.py): Socket Mode, with no dependencies of its own.
    "slack-sdk==3.46.0",
    # Claude Code as the lead, with a delegate tool (harness/claude_lead.py). Built from source: see [tool.uv].
    "claude-agent-sdk==0.2.170",
]

[project.optional-dependencies]
# provider = "openai" (any OpenAI-compatible endpoint) and "gemini" need their SDKs.
openai = ["strands-agents[openai]==1.57.0"]
gemini = ["strands-agents[gemini]==1.57.0"]

[project.scripts]
harness = "harness.cli:main"
orchestrator = "orchestrator.__main__:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-xdist==3.8.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness", "orchestrator"]

# Releases (.github/workflows/release.yml): the next version from the commits on
# main since the last tag, Conventional Commits: feat a minor, fix and perf a
# patch, `!` or BREAKING CHANGE a major (from 1.0 on: below it, a minor). The
# other types (docs, ci, chore, test, refactor...) release nothing on their own.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
# [skip ci]: the version commit starts no workflow (the release builds its images itself).
commit_message = "chore(release): v{version} [skip ci]"
# uv.lock records the project's own version too.
build_command = """
    pip install -q uv==0.11.25
    uv lock --upgrade-package burst-harness
    git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
# A squash merge's commit is the PR's title; the branch's own commits listed in
# its body do not each count.
parse_squash_commits = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.uv]
# The SDK's wheels carry a Claude Code binary (about 125 MB) that the harness never runs: `claude` is the target's.
no-binary-package = ["claude-agent-sdk"]
